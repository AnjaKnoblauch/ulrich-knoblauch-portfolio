<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ulrich Knoblauch | Photographer</title>

    <style>
    body {
        margin: 0;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .gallery {
        position: relative;
        width: 100%;
        height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .gallery img {
        max-width: 90%;
        max-height: 75vh;
        width: auto;
        height: auto;
    }

    button {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        color: white;
        border: none;
        font-size: 40px;
        cursor: pointer;
    }

    .prev {
        left: 20px;
    }

    .next {
        right: 20px;
    }
</style>
</head>

<body>

    <h1>Ulrich Knoblauch</h1>

    <p>Photographer</p>

    <div class="gallery">

    <button class="prev" onclick="previousPhoto()">‹</button>

    <img id="mainPhoto" src="images/photo1.png" alt="Ulrich Knoblauch photography">

    <button class="next" onclick="nextPhoto()">›</button>

</div>
<script>
    const photos = [
        "images/photo1.png",
        "images/photo2.png",
        "images/photo3.png",
        "images/photo4.png",
        "images/photo5.png"
    ];

    let currentPhoto = 0;

    function showPhoto() {
        document.getElementById("mainPhoto").src = photos[currentPhoto];
    }

    function nextPhoto() {
        currentPhoto = (currentPhoto + 1) % photos.length;
        showPhoto();
    }

    function previousPhoto() {
        currentPhoto = (currentPhoto - 1 + photos.length) % photos.length;
        showPhoto();
    }
</script>
</body>

</html>
