<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ulrich Knoblauch | Photographer</title>

    <style>
    body {
        margin: 0;
        background: white;
        color: black;
        font-family: Arial, sans-serif;
        text-align: center;
    }
header {
    display: flex;
    align-items: center;
    padding: 25px 45px;
}

h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
}

nav {
    display: flex;
    align-items: center;
    margin-left: auto;
}

nav a {
    color: black;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 3px;
    margin-right: 35px;
    text-transform: uppercase;
}

nav a:hover {
    text-decoration: underline;
}


p {
    margin: 0;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
}
        
    .gallery {
        position: relative;
        width: 100%;
        height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
transform: translateX(90px);
    }

    .gallery img {
        max-width: 90%;
        max-height: 72vh;
        width: auto;
        height: auto;
    }

    button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    color: black;
    border: none;
    font-size: 38px;
    font-weight: 300;
    cursor: pointer;
    padding: 10px;
    opacity: 0.55;
    transition: opacity 0.3s ease;
}

button:hover {
    opacity: 1;
}
        button:focus {
    outline: none;
}
.photo-frame {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.prev {
    left: -50px;
}

.next {
    right: -50px;
}
    
</style>
</head>

<body>

    

    <header>
        <div class="logo">ULRICH KNOBLAUCH</div>

        <nav>
            <a href="#">PORTFOLIO</a>
            <a href="#">EDITORIAL</a>
            <a href="#">BIO / CONTACT</a>
        </nav>
    </header>

    <div class="gallery">

    <div class="photo-frame">

        <img id="mainPhoto" src="images/photo1.png" alt="Ulrich Knoblauch photography">

        <button class="prev" onclick="previousPhoto()">‹</button>

        <button class="next" onclick="nextPhoto()">›</button>

    </div>

</div>
<script>
    const photos = [
        "images/photo1.png",
        "images/photo2.png",
        "images/photo3.png",
        "images/photo4.png",
        "images/photo5.png"
    ];

    let currentPhoto = 0;

    function showPhoto() {
        document.getElementById("mainPhoto").src = photos[currentPhoto];
    }

    function nextPhoto() {
        currentPhoto = (currentPhoto + 1) % photos.length;
        showPhoto();
    }

    function previousPhoto() {
        currentPhoto = (currentPhoto - 1 + photos.length) % photos.length;
        showPhoto();
    }
    let touchStartX = 0;
    let touchEndX = 0;

    document.getElementById("mainPhoto").addEventListener("touchstart", function(event) {
        touchStartX = event.changedTouches[0].screenX;
    });

    document.getElementById("mainPhoto").addEventListener("touchend", function(event) {
        touchEndX = event.changedTouches[0].screenX;

        if (touchEndX < touchStartX - 50) {
            nextPhoto();
        }

        if (touchEndX > touchStartX + 50) {
            previousPhoto();
        }
    });
</script>
</body>

</html>
