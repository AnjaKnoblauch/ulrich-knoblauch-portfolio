<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ulrich Knoblauch | Photographer</title>

    <style>
    body {
        margin: 0;
        background: white;
        color: black;
        font-family: Arial, sans-serif;
        text-align: center;
    }
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: transparent;
    box-sizing: border-box;
}

h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
}

nav {
    display: flex;
    align-items: center;
    margin-left: auto;
}

nav a {
    color: black;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 3px;
    margin-right: 35px;
    text-transform: uppercase;
}

nav a:hover {
    text-decoration: underline;
}


p {
    margin: 0;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
}
        
    .gallery {
    display: flex;
    flex-direction: column;
    width: 100%;
    align-items: center;
        gap: 60px;
}

    .gallery img {
    display: block;
    width: 100%;
    height: 100vh;
    object-fit: cover;
    object-position: center;
    margin: 0;
}

    button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    color: black;
    border: none;
    font-size: 30px;
    font-weight: 400;
    cursor: pointer;
    padding: 10px;
    opacity: 0.7;
    transition: opacity 0.3s ease;
}

button:hover {
    opacity: 1;
}
        button:focus {
    outline: none;
}
.photo-frame {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.prev {
    left: -50px;
}

.next {
    right: -50px;
}
  .view-toggle {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 14px;
    margin-top: 20px;
    margin-bottom: 10px;
    padding-right: 75px;
    box-sizing: border-box;
}

.view-toggle button {
    position: static;
    transform: none;
    padding: 0;
    opacity: 0.45;
    font-size: 24px;
    line-height: 1;
}

.view-toggle button:hover {
    opacity: 1;
}  
      .grid-icon {
    display: grid;
    grid-template-columns: repeat(2, 7px);
    grid-template-rows: repeat(2, 7px);
    gap: 3px;
}

.grid-icon span {
    width: 7px;
    height: 7px;
    background: #777;
    display: block;
}

.single-icon {
    width: 18px;
    height: 18px;
    border: 2px solid #777;
    display: block;
    box-sizing: border-box;
}
        .all-photos {
    display: none;
    width: 100%;
    box-sizing: border-box;
    padding: 30px 20px 80px;
    gap: 10px;
    align-items: flex-start;
    flex-wrap: wrap;
}

.all-photos img {
    width: auto;
    height: 150px;
    object-fit: contain;
    display: block;
}
</style>
</head>

<body>

    

    <header>
        <div class="logo">ULRICH KNOBLAUCH</div>

        <nav>
            <a href="portfolio.html">PORTFOLIO</a>
            <a href="#">EDITORIAL</a>
            <a href="#">BIO / CONTACT</a>
        </nav>
    </header>
<div class="view-toggle">
    <button class="grid-view" onclick="showGrid()" aria-label="Grid view">
    <span class="grid-icon">
        <span></span><span></span>
        <span></span><span></span>
    </span>
</button>

<button class="single-view" onclick="showSingle()" aria-label="Single image view">
    <span class="single-icon"></span>
</button>
</div>
    <div class="gallery">

    <img src="images/photo1.png" alt="Ulrich Knoblauch photography">
    <img src="images/photo2.png" alt="Ulrich Knoblauch photography">
    <img src="images/photo3.png" alt="Ulrich Knoblauch photography">
    <img src="images/photo4.png" alt="Ulrich Knoblauch photography">
    <img src="images/photo5.png" alt="Ulrich Knoblauch photography">

</div>
    <div class="all-photos" id="allPhotos">
    <img src="images/photo1.png" alt="Ulrich Knoblauch photography">
    <img src="images/photo2.png" alt="Ulrich Knoblauch photography">
    <img src="images/photo3.png" alt="Ulrich Knoblauch photography">
    <img src="images/photo4.png" alt="Ulrich Knoblauch photography">
    <img src="images/photo5.png" alt="Ulrich Knoblauch photography">
</div>
<script>
    
    function showGrid() {
    document.querySelector(".gallery").style.display = "none";
    document.getElementById("allPhotos").style.display = "flex";
}

function showSingle() {
    document.getElementById("allPhotos").style.display = "none";
    document.querySelector(".gallery").style.display = "flex";
}

</script>
</body>

</html>
