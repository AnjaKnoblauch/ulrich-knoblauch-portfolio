    body {
        margin: 0;

        color: black;

    }
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: white;
    box-sizing: border-box;

    display: flex;
    align-items: center;
    padding: 18px 40px;
}
h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
}

nav {
    display: flex;
    align-items: center;
    margin-left: auto;
}

nav a {
    color: black;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 3px;
    margin-right: 35px;
    text-transform: uppercase;
}

nav a:hover {
    text-decoration: underline;
}


p {
    margin: 0;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
}
        
    .gallery {
    display: flex;
    flex-direction: column;
    width: 100%;
    align-items: center;
        gap: 40px;
}

    .gallery img {
    display: block;
    width: auto;
    max-width: 100%;
    height: auto;
    max-height: 100vh;
    object-fit: contain;
    margin: 0 auto;
}
    button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    color: black;
    border: none;
    font-size: 30px;
    font-weight: 400;
    cursor: pointer;
    padding: 10px;
    opacity: 0.7;
    transition: opacity 0.3s ease;
}

button:hover {
    opacity: 1;
}
        button:focus {
    outline: none;
}
.photo-frame {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.prev {
    left: -50px;
}

.next {
    right: -50px;
}
  .view-toggle {
    position: fixed;
    top: 62px;
    right: 40px;
    z-index: 1001;
    display: flex;
    gap: 14px;
    align-items: center;
}

.view-toggle button {
    position: static;
    transform: none;
    padding: 0;
    opacity: 0.45;
    font-size: 24px;
    line-height: 1;
}

.view-toggle button:hover {
    opacity: 1;
}  
      .grid-icon {
    display: grid;
    grid-template-columns: repeat(2, 7px);
    grid-template-rows: repeat(2, 7px);
    gap: 3px;
}

.grid-icon span {
    width: 7px;
    height: 7px;
    background: #777;
    display: block;
}

.single-icon {
    width: 18px;
    height: 18px;
    border: 2px solid #777;
    display: block;
    box-sizing: border-box;
}
        .all-photos {
    display: none;
    width: 100%;
    box-sizing: border-box;
    padding: 30px 20px 80px;
    gap: 10px;
    align-items: flex-start;
    flex-wrap: wrap;
}

.all-photos img {
    width: auto;
    height: 150px;
    object-fit: contain;
    display: block;
}
</style>
